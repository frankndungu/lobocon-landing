<svg width="1200" height="600" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="particleBlur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" />
    </filter>
    <linearGradient id="layerGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.2" />
      <stop offset="50%" style="stop-color:#10b981;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Base background -->
  <rect width="1200" height="600" fill="#0f172a"/>
  
  <!-- Layered curved shapes suggesting structural layers -->
  <!-- Bottom layer - darkest, structural foundation -->
  <path d="M0,500 Q300,450 600,480 T1200,500 L1200,600 L0,600 Z" fill="#1e293b" opacity="0.4"/>
  
  <!-- Second layer - concrete-like texture -->
  <path d="M0,420 Q250,380 500,410 Q750,440 1200,400 L1200,520 Q600,480 0,520 Z" fill="#10b981" opacity="0.08" filter="url(#particleBlur)"/>
  
  <!-- Third layer - structural elements -->
  <path d="M0,350 Q200,320 400,360 Q600,310 800,340 Q1000,370 1200,320 L1200,480 Q600,420 0,450 Z" fill="#10b981" opacity="0.12"/>
  
  <!-- Top flowing curve - like layered materials -->
  <path d="M0,280 Q150,240 300,270 Q450,200 600,250 Q750,220 900,280 Q1050,240 1200,260 L1200,420 L0,400 Z" fill="#10b981" opacity="0.15" filter="url(#particleBlur)"/>
  
  <!-- Accent curves - hint at brick/concrete patterns -->
  <g opacity="0.08">
    <path d="M0,200 Q300,160 600,210 Q900,180 1200,220" stroke="#10b981" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M0,150 Q350,120 700,160 Q1000,140 1200,180" stroke="#10b981" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
  </g>
  
  <!-- Subtle particles suggesting texture (like concrete/aggregate) -->
  <g opacity="0.15" filter="url(#particleBlur)">
    <circle cx="200" cy="350" r="2" fill="#10b981"/>
    <circle cx="400" cy="300" r="1.5" fill="#10b981"/>
    <circle cx="600" cy="400" r="2.5" fill="#10b981"/>
    <circle cx="800" cy="280" r="1.8" fill="#10b981"/>
    <circle cx="1000" cy="350" r="2" fill="#10b981"/>
    <circle cx="150" cy="450" r="1.5" fill="#10b981"/>
    <circle cx="500" cy="480" r="2" fill="#10b981"/>
    <circle cx="900" cy="420" r="1.8" fill="#10b981"/>
    <circle cx="1100" cy="380" r="1.5" fill="#10b981"/>
    <circle cx="300" cy="520" r="2" fill="#10b981"/>
  </g>
</svg>
